id: airport
name: Terminal 5, Concourse B
hub_type: airport
voice_id: JBFqnCBsd6RMkjVDRZzb   # PLACEHOLDER: a stock ElevenLabs voice taken from the API docs example.
                              # Listen in EN/ES/FR and replace before the pitch (PLAN open items).
voice_settings: {}      # optional: stability, similarity_boost, style, speed
style_guide: |
  Courteous and clear, then firmer as urgency rises. Address the passenger by full name.
  Always say where to go (the gate). Mention the flight and destination when it helps the
  passenger recognise the message. One or two short sentences. No jokes, no threats.
allowed_terms: [Gate, Concourse, Terminal]
zones:
  - {id: gate-23, name: Gate 23, languages: [en, es, fr]}
  - {id: concourse-b, name: Concourse B, languages: [en, es, fr]}
policies:
  passenger_page:
    zones: [gate-23, concourse-b]
    interval_s: 120
    max_plays: 3
    duration_s: 360
    escalate: true
    priority: paging          # pages outrank delays and info (D19)
gazetteer:
  cities: [New York, London, Madrid, Paris, Barcelona, Dublin, Edinburgh, Los Angeles, Miami,
           Rome, Lisbon, Nice]
  airlines: [British Airways, Iberia, Air France, Virgin Atlantic]
  aliases:
    New York: [NYC, Nueva York, New-York]
    London: [Londres]
    Rome: [Roma]
    Lisbon: [Lisboa, Lisbonne]
