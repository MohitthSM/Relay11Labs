# Same contract as vite.config.ts: /api/* goes to the backend with the prefix stripped.
server {
    listen 80;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8000/;   # trailing slash strips /api
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;   # /api/ws/events
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1h;                  # the WebSocket stays open
    }

    location / {
        try_files $uri /index.html;
    }
}
